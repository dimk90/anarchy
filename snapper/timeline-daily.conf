# snapper-timeline.timer ships OnCalendar=hourly, and TIMELINE_LIMIT_* only
# steers the cleanup algorithm - so with the daily-granularity home config
# snapper creates 24 snapshots a day for cleanup to prune 23 back out. The
# empty OnCalendar= clears the inherited schedule before the daily one is set
# (a second value would add to it); Persistent=true catches up a run missed
# while the machine was off.
[Timer]
OnCalendar=
OnCalendar=daily
Persistent=true
