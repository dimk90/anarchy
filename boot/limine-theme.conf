
# === Theme ===

# empty value hides the "Limine X.Y.Z" header
interface_branding:
# Console font - Spleen (raw CP437 8x16, see font/limine/), scaled 2x for HiDPI
term_font: boot():/spleen-8x16.bin
term_font_size: 8x16
term_font_scale: 2x2

# Monochrome - black backdrop, gray body text, white highlights
#   backdrop                 color outside the terminal box (no wallpaper)
#   term_background          terminal box bg - match backdrop = flat surface
#   term_foreground          default text color in the menu (gray)
#   term_background_bright   selected-entry bar background (dim gray)
#   term_foreground_bright   selected-entry / hotkey text (white)
backdrop: 000000
term_background: 000000
term_foreground: 707070
term_background_bright: 333333
term_foreground_bright: ffffff
term_palette: 000000;707070;707070;707070;707070;707070;707070;707070
term_palette_bright: 808080;ffffff;ffffff;ffffff;ffffff;ffffff;ffffff;ffffff

# Hint text (ARROW/ENTER/...) - defaults are green/cyan, override for B&W:
#   interface_help_colour          key hints (default 00aa00 = green)
#   interface_help_colour_bright   countdown digit accent
#   interface_branding_colour      branding string (default 00aaaa = cyan)
interface_help_colour: ffffff
interface_help_colour_bright: 20b0f0
interface_branding_colour: ffffff
