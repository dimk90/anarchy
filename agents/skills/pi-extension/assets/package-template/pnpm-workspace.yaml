# Pi releases often and the dev pins must match the local `pi --version`, so a
# minimum release age policy must not delay Pi packages.
minimumReleaseAgeExclude:
  - "@earendil-works/pi-*"

# Transitive install scripts that Pi does not need; deny them so pnpm does not
# ask. Add `true` entries only for reviewed runtime dependencies that need one.
allowBuilds:
  "@google/genai": false
  protobufjs: false
