# Pi 1.1 needs no dependency lifecycle scripts for normal installation.
# Add allowBuilds entries only for reviewed dependencies that require them.

# pi releases often, and the dev pins must match the locally installed pi, so
# they must not be delayed by a minimum release age policy.
minimumReleaseAgeExclude:
  - "@earendil-works/pi-*"
  - "@earendil-works/chord"

# Pi packages depend on each other with caret ranges, so a newer transitive
# pi-ai can be installed next to the pinned one and break type identity
# (e.g. createProvider() results). Pin the whole Pi family to `pi --version`.
overrides:
  "@earendil-works/pi-coding-agent": "{{pi --version}}"
  "@earendil-works/pi-ai": "{{pi --version}}"
  "@earendil-works/pi-agent-core": "{{pi --version}}"
  "@earendil-works/pi-tui": "{{pi --version}}"
  "@earendil-works/pi-codemode": "{{pi --version}}"
  "@earendil-works/pi-mcp": "{{pi --version}}"
  "@earendil-works/pi-telemetry": "{{pi --version}}"
  "@earendil-works/chord": "{{pi --version}}"
